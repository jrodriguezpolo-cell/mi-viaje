<!DOCTYPE html>
<html>
<head>
    <title>Migrar datos a Firebase</title>
    <meta charset="UTF-8">
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
        import { getFirestore, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
        import { firebaseConfig } from './firebase-config.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.login = () => signInWithPopup(auth, provider);
        
        onAuthStateChanged(auth, user => {
            document.getElementById('status').innerText = user? `Logueado como: ${user.email}` : 'No logueado';
            document.getElementById('upload').style.display = user? 'block' : 'none';
        });

        window.migrar = async () => {
            const file = document.getElementById('file').files[0];
            if (!file) return alert('Selecciona tu fichero JSON primero');
            
            const user = auth.currentUser;
            if (!user) return alert('Haz login primero');
            
            const text = await file.text();
            const data = JSON.parse(text);
            
            await setDoc(doc(db, "viajes", user.uid), data);
            alert('¡Datos subidos a Firebase! Ya puedes volver a la app principal');
        }
    </script>
</head>
<body style="font-family: sans-serif; padding: 40px; max-width: 600px; margin: auto;">
    <h1>Migrar Mi Viaje a Firebase</h1>
    <p id="status">No logueado</p>
    <button onclick="login()">1. Login con Google</button>
    <hr>
    <div id="upload" style="display:none">
        <h3>2. Sube tu fichero JSON con los datos del viaje</h3>
        <input type="file" id="file" accept=".json">
        <br><br>
        <button onclick="migrar()">3. Migrar a Firebase</button>
    </div>
</body>
