<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Mi Viaje (Firebase)</title>
  <style>
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui; background:#f6f7fb;}
    #app{display:none; padding:16px;}
    .card{max-width:520px;margin:48px auto;background:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.08);padding:22px;}
    .pill{display:inline-flex;gap:8px;align-items:center;background:#f1f3f7;border-radius:999px;padding:8px 12px;color:#445;}
    h1{margin:14px 0 6px;font-size:40px;letter-spacing:-.02em;color:#0b1220;}
    p{margin:0;color:#556;line-height:1.35;}
    button{appearance:none;border:0;border-radius:14px;padding:14px 16px;font-size:18px;font-weight:700;cursor:pointer}
    .primary{background:#2563eb;color:#fff;width:100%;margin-top:18px}
    .secondary{background:#eef2ff;color:#1e3a8a;width:100%;margin-top:10px}
    .muted{color:#778; font-size:13px; margin-top:14px}
    .diag{margin-top:12px;background:#0b1220;color:#cfe; padding:12px;border-radius:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;display:none}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .row button{flex:1;min-width:140px}
    .danger{background:#fee2e2;color:#7f1d1d}
  </style>
</head>
<body>
  <div id="loginScreen" class="card" style="display:none;">
    <div class="pill">🔒 <strong>Acceso privado</strong></div>
    <h1>Inicia sesión</h1>
    <p>Inicia sesión para ver el viaje.</p>
    <button id="loginBtn" class="primary">Iniciar sesión con Google</button>
    <button id="reloadBtn" class="secondary">Recargar</button>
    <button id="toggleDiagBtn" class="secondary">Mostrar diagnóstico</button>
    <div id="diag" class="diag"></div>
    <div class="muted">
      Si estás en iPhone, asegúrate de abrirlo en Safari (no en navegador integrado de otra app) y desactiva “Navegación privada”.
    </div>
  </div>

  <div id="app">
    <div class="card" style="margin-top:18px;">
      <div class="pill">✅ <strong>Sesión iniciada</strong></div>
      <p id="who" class="muted" style="margin-top:10px;"></p>
      <div class="row">
        <button id="logoutBtn" class="danger">Cerrar sesión</button>
        <button id="forceReloadBtn" class="secondary">Forzar recarga</button>
      </div>
      <div class="muted" style="margin-top:14px;">
        Esta es una plantilla de login + Firestore. Integra aquí tu app real.
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import {
      initializeAuth,
      browserLocalPersistence,
      indexedDBLocalPersistence,
      browserPopupRedirectResolver,
      GoogleAuthProvider,
      signInWithRedirect,
      getRedirectResult,
      onAuthStateChanged,
      signOut,
      setPersistence
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    // ====== CONFIG ======
    const EMAILS_PERMITIDOS = [
      'jrodriguezpolo@gmail.com',
      'maravillasmi...@gmail.com' // <-- pon aquí el email real de tu mujer
    ].map(e => e.trim().toLowerCase()).filter(Boolean);

    const firebaseConfig = {
      apiKey: "AIzaSyAG8uGu1rE6jCGrYzTN2C9KZm11C5t0mbE",
      authDomain: "mi-viaje-27178.firebaseapp.com",
      projectId: "mi-viaje-27178",
      storageBucket: "mi-viaje-27178.firebasestorage.app",
      messagingSenderId: "284807555246",
      appId: "1:284807555246:web:b63d757f7db25552fde53f"
    };

    // ====== UI helpers ======
    const $ = (id) => document.getElementById(id);
    const loginScreen = $('loginScreen');
    const appDiv = $('app');
    const diagEl = $('diag');

    function diag(msg){
      const ts = new Date().toISOString();
      diagEl.textContent += `[${ts}] ${msg}\n`;
      console.log(msg);
    }
    function showLogin(){
      appDiv.style.display = 'none';
      loginScreen.style.display = 'block';
    }
    function showApp(user){
      loginScreen.style.display = 'none';
      appDiv.style.display = 'block';
      $('who').textContent = `Hola, ${user.email || user.uid}`;
    }
    $('reloadBtn').onclick = () => location.reload();
    $('forceReloadBtn').onclick = () => location.reload(true);
    $('toggleDiagBtn').onclick = () => {
      const isHidden = (diagEl.style.display === 'none' || !diagEl.style.display);
      diagEl.style.display = isHidden ? 'block' : 'none';
      $('toggleDiagBtn').textContent = isHidden ? 'Ocultar diagnóstico' : 'Mostrar diagnóstico';
    };

    // ====== Init Firebase ======
    const app = initializeApp(firebaseConfig);

    // IMPORTANT: explicit persistence + redirect resolver reduces iOS "user=null" loops.
    const auth = initializeAuth(app, {
      persistence: [indexedDBLocalPersistence, browserLocalPersistence],
      popupRedirectResolver: browserPopupRedirectResolver
    });
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    // Extra safety
    try{
      await setPersistence(auth, browserLocalPersistence);
      diag('setPersistence: browserLocalPersistence OK');
    }catch(e){
      diag('setPersistence ERROR: ' + (e?.code || e?.message || e));
    }

    showLogin();

    $('loginBtn').onclick = async () => {
      diagEl.textContent = '';
      try{
        diag('signInWithRedirect: starting…');
        await signInWithRedirect(auth, provider);
      }catch(e){
        diag('signInWithRedirect ERROR: ' + (e?.code || e?.message || e));
        showLogin();
      }
    };

    $('logoutBtn').onclick = async () => {
      try{ await signOut(auth); diag('signOut OK'); } catch(e){ diag('signOut ERROR: ' + (e?.code || e?.message || e)); }
      showLogin();
    };

    // 1) Drain redirect result first
    try{
      const res = await getRedirectResult(auth);
      if(res?.user){
        diag('getRedirectResult: user=' + (res.user.email || res.user.uid));
      }else{
        diag('getRedirectResult: no pending redirect');
      }
    }catch(e){
      diag('getRedirectResult ERROR: ' + (e?.code || e?.message || e));
    }

    // 2) Then listen to auth state
    onAuthStateChanged(auth, async (user) => {
      diag('onAuthStateChanged user=' + (user ? (user.email || user.uid) : 'null'));

      // Safari sometimes fires null before hydrating persistence; wait a beat and re-check once.
      if(!user){
        await new Promise(r => setTimeout(r, 350));
        const u2 = auth.currentUser;
        diag('post-wait currentUser=' + (u2 ? (u2.email || u2.uid) : 'null'));
        if(!u2){
          showLogin();
          return;
        }
        user = u2;
      }

      const email = (user.email || '').toLowerCase();
      if(!EMAILS_PERMITIDOS.includes(email)){
        showLogin();
        diag('Email no permitido: ' + email);
        alert('Esta cuenta no tiene permiso.');
        return;
      }

      // Minimal Firestore handshake
      try{
        const ref = doc(db, 'shared', 'mi-viaje-2024');
        const snap = await getDoc(ref);
        if(!snap.exists()){
          await setDoc(ref, { createdAt: serverTimestamp(), createdBy: email });
          diag('Firestore: doc creado');
        }else{
          diag('Firestore: doc OK');
        }
      }catch(e){
        diag('Firestore ERROR: ' + (e?.code || e?.message || e));
      }

      showApp(user);
    });
  </script>
</body>
</html>
